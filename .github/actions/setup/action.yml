name: Setup
description: Install the pinned Bun and the project dependencies

runs:
  using: composite
  steps:
    # `oven-sh/setup-bun` cannot install a pinned canary build, so install it from npm.
    # Remove this when Bun's linter is in a stable release.
    - name: Install bun
      shell: bash
      run: |
        version=$(node --print "require('./package.json').packageManager.replace('bun@', '')")
        npm install --prefix "$RUNNER_TEMP/bun" "bun@$version"
        echo "$RUNNER_TEMP/bun/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
