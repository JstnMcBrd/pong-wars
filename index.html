<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pong Wars</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header id="header">
      <h1>Pong Wars</h1>
      <nav>
        <a href="https://jstnmcbrd.github.io" target="_blank" rel="noopener">Justin McBride</a>
        <span class="sep">·</span>
        <a href="https://github.com/JstnMcBrd/pong-wars" target="_blank" rel="noopener">Source</a>
      </nav>
    </header>

    <!-- Shown in place of the app when no WebGPU device can be acquired. -->
    <section id="failure" hidden>
      <h2>WebGPU required</h2>
      <p id="failure-detail"></p>
      <p>
        The simulation runs entirely on the GPU. Check what your setup supports at
        <a href="https://webgpucheck.com/" target="_blank" rel="noopener">webgpucheck.com</a>.
      </p>
    </section>

    <main id="app">
      <canvas id="view"></canvas>

      <div id="sidebar">
        <div id="controls">
          <!-- Idle state -->
          <button id="btn-start" aria-label="Play"><i data-lucide="play"></i></button>

          <!-- Running state -->
          <button id="btn-stop" hidden aria-label="Stop"><i data-lucide="square"></i></button>
          <button id="btn-pause" hidden aria-label="Pause"><i data-lucide="pause"></i></button>

          <!-- Paused state -->
          <button id="btn-resume" hidden aria-label="Play"><i data-lucide="play"></i></button>

          <span id="fps-counter" class="setting-label">? FPS</span>
        </div>

        <div class="setting">
          <label>
            <span class="setting-label">Grid Size</span>
            <span class="setting-value" id="val-grid-size">?x?</span>
          </label>
          <div class="slider-row">
            <button
              class="step-btn"
              id="dec-grid-size"
              tabindex="-1"
              aria-label="Decrease grid size"
            >
              −
            </button>
            <input type="range" id="inp-grid-size" min="?" max="?" value="?" />
            <button
              class="step-btn"
              id="inc-grid-size"
              tabindex="-1"
              aria-label="Increase grid size"
            >
              +
            </button>
          </div>
        </div>

        <div class="setting">
          <label>
            <span class="setting-label">Teams</span>
            <span class="setting-value" id="val-num-teams">?</span>
          </label>
          <div class="slider-row">
            <button class="step-btn" id="dec-num-teams" tabindex="-1" aria-label="Decrease teams">
              −
            </button>
            <input type="range" id="inp-num-teams" min="?" max="?" value="?" />
            <button class="step-btn" id="inc-num-teams" tabindex="-1" aria-label="Increase teams">
              +
            </button>
          </div>
        </div>

        <div class="setting">
          <label>
            <span class="setting-label">Speed (ticks/frame)</span>
            <span class="setting-value" id="val-ticks-per-frame">?</span>
          </label>
          <div class="slider-row">
            <button
              class="step-btn"
              id="dec-ticks-per-frame"
              tabindex="-1"
              aria-label="Decrease speed"
            >
              −
            </button>
            <input type="range" id="inp-ticks-per-frame" min="?" max="?" value="?" />
            <button
              class="step-btn"
              id="inc-ticks-per-frame"
              tabindex="-1"
              aria-label="Increase speed"
            >
              +
            </button>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
