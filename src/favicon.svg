<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    True 8-team pinwheel. Each team occupies a 45° angular wedge from the center.
    Team assignment: angle θ from center → team = (floor(θ/45) + 7) % 8
    Colors: hsl(i*45, 70%, 55%) for i=0..7

    Grid (C=cyan/4, B=blue/5, V=purple/6, K=pink/7,
          R=red/0, O=orange/1, Y=lime/2, T=teal/3):
      row 0: C C C C B B B V
      row 1: T C C C B B V V
      row 2: T T C C B V V V
      row 3: T T T C V V V V
      row 4: Y Y Y Y R K K K
      row 5: Y Y Y O R R K K
      row 6: Y Y O O R R R K
      row 7: Y O O O R R R R
  -->
  <!-- Cyan #3CDCDC -->
  <rect x="0"  y="0"  width="16" height="4" fill="#3CDCDC"/>
  <rect x="4"  y="4"  width="12" height="4" fill="#3CDCDC"/>
  <rect x="8"  y="8"  width="8"  height="4" fill="#3CDCDC"/>
  <rect x="12" y="12" width="4"  height="4" fill="#3CDCDC"/>
  <!-- Blue #3C64DC -->
  <rect x="16" y="0"  width="12" height="4" fill="#3C64DC"/>
  <rect x="16" y="4"  width="8"  height="4" fill="#3C64DC"/>
  <rect x="16" y="8"  width="4"  height="4" fill="#3C64DC"/>
  <!-- Purple #8C3CDC -->
  <rect x="28" y="0"  width="4"  height="4" fill="#8C3CDC"/>
  <rect x="24" y="4"  width="8"  height="4" fill="#8C3CDC"/>
  <rect x="20" y="8"  width="12" height="4" fill="#8C3CDC"/>
  <rect x="16" y="12" width="16" height="4" fill="#8C3CDC"/>
  <!-- Pink #DC3CB4 -->
  <rect x="20" y="16" width="12" height="4" fill="#DC3CB4"/>
  <rect x="24" y="20" width="8"  height="4" fill="#DC3CB4"/>
  <rect x="28" y="24" width="4"  height="4" fill="#DC3CB4"/>
  <!-- Teal #3CDCB4 -->
  <rect x="0"  y="4"  width="4"  height="4" fill="#3CDCB4"/>
  <rect x="0"  y="8"  width="8"  height="4" fill="#3CDCB4"/>
  <rect x="0"  y="12" width="12" height="4" fill="#3CDCB4"/>
  <!-- Lime #8CDC3C -->
  <rect x="0"  y="16" width="16" height="4" fill="#8CDC3C"/>
  <rect x="0"  y="20" width="12" height="4" fill="#8CDC3C"/>
  <rect x="0"  y="24" width="8"  height="4" fill="#8CDC3C"/>
  <rect x="0"  y="28" width="4"  height="4" fill="#8CDC3C"/>
  <!-- Orange #DCB43C -->
  <rect x="12" y="20" width="4"  height="4" fill="#DCB43C"/>
  <rect x="8"  y="24" width="8"  height="4" fill="#DCB43C"/>
  <rect x="4"  y="28" width="12" height="4" fill="#DCB43C"/>
  <!-- Red #DC3C3C -->
  <rect x="16" y="16" width="4"  height="4" fill="#DC3C3C"/>
  <rect x="16" y="20" width="8"  height="4" fill="#DC3C3C"/>
  <rect x="16" y="24" width="12" height="4" fill="#DC3C3C"/>
  <rect x="16" y="28" width="16" height="4" fill="#DC3C3C"/>
  <!-- Balls: white dot centered in each team's wedge, arranged in a ring -->
  <circle cx="10" cy="6"  r="1.5" fill="white"/>
  <circle cx="22" cy="6"  r="1.5" fill="white"/>
  <circle cx="26" cy="10" r="1.5" fill="white"/>
  <circle cx="26" cy="22" r="1.5" fill="white"/>
  <circle cx="22" cy="26" r="1.5" fill="white"/>
  <circle cx="10" cy="26" r="1.5" fill="white"/>
  <circle cx="6"  cy="22" r="1.5" fill="white"/>
  <circle cx="6"  cy="10" r="1.5" fill="white"/>
</svg>
